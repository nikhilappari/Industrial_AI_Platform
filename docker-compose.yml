version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./safety_monitor.db
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-secure-random-string}
      - MODEL_REPO_ID=Hansung-Cho/yolov8-ppe-detection
      - DEVICE=auto
      - PERSON_CONFIDENCE=0.35
      - PPE_CONFIDENCE=0.40
      - FRAME_SAMPLE_FPS=5
      - VIOLATION_CONFIRM_FRAMES=5
      - INCIDENT_COOLDOWN_SECONDS=30
      - EVIDENCE_DIR=./storage/evidence
      - UPLOAD_DIR=./storage/uploads
      - MAX_UPLOAD_MB=500
    volumes:
      - ./storage:/app/storage
      - model-cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model-cache:
